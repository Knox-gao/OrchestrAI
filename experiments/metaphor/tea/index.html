<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>七汤 · 汤花 — 宋代点茶专题（隐喻版）</title>
<style>
:root { --paper:#efe9dc; --ink:#2b2620; --dim:rgba(43,38,32,.66); --bowl:#191512; --foam:#f3ede0;
  --red:#a8392e; --line:rgba(43,38,32,.16); }
* { margin:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--paper); color:var(--ink); font-family:Georgia,'Songti SC',serif; }
/* 首屏：盏与题 */
.hero { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding:0 20px; }
.hero .kick { font:400 10px/1 ui-monospace,monospace; letter-spacing:.42em; color:var(--red); margin-bottom:22px; }
.hero h1 { font-weight:400; font-size:clamp(38px,6vw,72px); letter-spacing:.42em; text-indent:.42em; }
.hero .en { font:300 11px/1 ui-monospace,monospace; letter-spacing:.5em; color:var(--dim); margin-top:16px; }
.hero .scroll-hint { position:absolute; bottom:34px; font-size:12px; letter-spacing:.3em; color:var(--dim); animation:bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(6px); } }
/* 盏：黑釉盏 + 七层汤花（滚动驱动） */
.bowl-wrap { position:relative; width:min(430px,78vw); margin:clamp(28px,6vh,56px) auto 0; }
.bowl { width:100%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 38% 34%, #2b241e 0%, #191512 55%, #0d0b09 100%); box-shadow:inset 0 10px 40px rgba(0,0,0,.55), 0 22px 60px rgba(43,38,32,.28); position:relative; overflow:hidden; }
.ring { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; border:1.5px solid rgba(243,237,224,.0); transition:border-color .6s, box-shadow .6s, transform .6s; pointer-events:none; }
.ring.lit { border-color:rgba(243,237,224,.78); box-shadow:0 0 0 6px rgba(243,237,224,.08); }
/* 七汤段落：滚动即注汤 */
.pours { max-width:820px; margin:0 auto; padding:10vh 24px 22vh; }
.pour { display:grid; grid-template-columns:96px 1fr; gap:26px; padding:9vh 0; border-bottom:1px solid var(--line); opacity:.24; transform:translateY(14px); transition:opacity .6s, transform .6s; }
.pour:nth-last-child(1) { border-bottom:none; }
.pour.lit { opacity:1; transform:none; }
.pour .no { font:300 clamp(40px,5vw,64px)/1 Georgia,serif; color:var(--red); text-align:right; }
.pour h2 { font-weight:400; font-size:clamp(20px,2.4vw,28px); letter-spacing:.22em; }
.pour .m { font:400 10.5px/1 ui-monospace,monospace; color:var(--dim); letter-spacing:.22em; margin:8px 0 14px; }
.pour p { font-size:14.5px; line-height:2.15; color:var(--dim); max-width:56ch; }
.pour .tip { margin-top:12px; font-family:'KaiTi','STKaiti',cursive; color:var(--red); font-size:14.5px; }
footer { text-align:center; padding:30px; font:400 9.5px/1.8 ui-monospace,monospace; color:var(--dim); letter-spacing:.22em; }
@media (max-width:760px) {
  .pour { grid-template-columns:56px 1fr; gap:16px; }
  .bowl-wrap { width:min(300px,86vw); }
}
@media (prefers-reduced-motion:reduce) { .hero .scroll-hint { animation:none; } .pour { opacity:1; transform:none; } .ring { transition:none; } }
</style>
</head>
<body>
<section class="hero">
  <div class="kick">SONG DYNASTY CHA · 文化专题</div>
  <h1>七汤 · 汤花</h1>
  <div class="en">THE SEVEN POURS — 隐喻：茶筅击拂后起伏的汤面</div>
  <div class="bowl-wrap"><div class="bowl" id="bowl"></div></div>
  <div class="scroll-hint">向下滚动 · 每注一汤 ↓</div>
</section>
<div class="pours" id="pours"></div>
<footer>示例文案 · 依《大观茶论》七汤法常识表述 · 隐喻推导见 metaphor-briefs.json</footer>
<script type="module">
const POURS = [
  { t:'调膏', m:'FIRST POUR · 调如融胶', d:'盏中置茶末，先以少许沸水调膏——击拂令匀，稠如融胶，为后续汤花立基。', tip:'「量茶受汤，调如融胶。」' },
  { t:'二汤', m:'SECOND POUR · 击拂既力', d:'注汤六分，茶筅用力击拂，自上而下如有拦拦然——汤面初现细珠蹙怒。', tip:'「真花乳浮盏面。」' },
  { t:'三汤', m:'THIRD POUR · 表里洞彻', d:'多筅重击，茶面色泽渐开，粟纹蟹眼纷然起伏——表里洞彻。', tip:null },
  { t:'四汤', m:'FOURTH POUR · 轻云渐生', d:'筅击渐轻渐匀，茶面隆起周回，凝而不动——轻云渐生。', tip:null },
  { t:'五汤', m:'FIFTH POUR · 结浚霭', d:'乃可稍纵击拂，茶面泛起浚霭、结凝雪——汤花始厚。', tip:null },
  { t:'六汤', m:'SIXTH POUR · 乳雾汹涌', d:'以筅.layout 居中绕盏，乳雾汹涌，溢盏而起——周回旋而不动。', tip:null },
  { t:'七汤', m:'SEVENTH POUR · 泛云雾然', d:'最后一次轻拂均匀，分茶可作字画——乳雾汹然作雪花状，谓之咬盏。', tip:'「周回旋而不动，谓之咬盏。」' },
];
POURS[5].d = POURS[5].d.replace('.layout ', ' ');
// 七层汤花环
const bowl = document.getElementById('bowl');
POURS.forEach((_, i) => {
  const r = document.createElement('div');
  r.className = 'ring';
  r.style.width = r.style.height = (16 + i * 11.5) + '%';
  bowl.appendChild(r);
});
const rings = [...bowl.querySelectorAll('.ring')];
// 七汤段落
const box = document.getElementById('pours');
POURS.forEach((p, i) => {
  const el = document.createElement('article');
  el.className = 'pour';
  el.innerHTML = `<div class="no">${['一', '二', '三', '四', '五', '六', '七'][i]}</div>
    <div><h2>${p.t}</h2><div class="m">${p.m}</div><p>${p.d}</p>${p.tip ? `<div class="tip">${p.tip}</div>` : ''}</div>`;
  box.appendChild(el);
});
const pours = [...box.querySelectorAll('.pour')];
// 滚动即注汤：汤层自内向外依次泛起（验收：顺序严格由内向外，600ms 内）
addEventListener('scroll', () => {
  const vh = innerHeight;
  let litCount = 0;
  pours.forEach((el) => {
    const r = el.getBoundingClientRect();
    if (r.top < vh * 0.72) { el.classList.add('lit'); }
  });
  litCount = pours.filter((x) => x.classList.contains('lit')).length;
  rings.forEach((r, i) => { if (i < litCount) r.classList.add('lit'); else r.classList.remove('lit'); });
}, { passive: true });
dispatchEvent(new Event('scroll'));
</script>
</body>
</html>
