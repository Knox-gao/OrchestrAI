<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地层档案 · 火山岩芯 — 全球火山活动档案（隐喻版）</title>
<style>
:root { --rock:#0d0c0a; --strata1:#8a5a33; --strata2:#b0793e; --strata3:#d19a5b; --ash:#5b544a;
  --ink:#e9e2d2; --dim:rgba(233,226,210,.6); --line:rgba(233,226,210,.14); --hi:#ffd9a0; }
* { margin:0; box-sizing:border-box; }
html,body { height:100%; }
body { background:var(--rock); color:var(--ink); font-family:Georgia,'Songti SC',serif; overflow-x:hidden; }
header { padding:clamp(20px,4vh,40px) clamp(20px,5vw,64px) 8px; display:flex; justify-content:space-between; align-items:baseline; }
h1 { font-weight:400; font-size:clamp(22px,2.6vw,34px); letter-spacing:.3em; }
.no { font:400 10px/1 ui-monospace,monospace; letter-spacing:.3em; color:var(--dim); }
/* 岩芯陈列：三根柱 */
.core-wall { display:flex; gap:clamp(18px,4vw,56px); padding:clamp(10px,2vh,24px) clamp(20px,5vw,64px) 24px; align-items:flex-start; }
.core { flex:1; max-width:190px; position:relative; }
.core h2 { font-size:15px; letter-spacing:.2em; font-weight:400; margin-bottom:4px; }
.core .sub { font:400 9.5px/1.6 ui-monospace,monospace; color:var(--dim); letter-spacing:.14em; margin-bottom:10px; }
.strata { display:flex; flex-direction:column; border:1px solid var(--line); background:linear-gradient(180deg,#141210,#0f0e0c); }
.layer { position:relative; cursor:pointer; transition:filter .15s, outline-color .15s; outline:1px solid transparent; }
.layer:hover { filter:brightness(1.35); }
.layer.on { outline-color:var(--hi); filter:brightness(1.3); }
.layer .yr { position:absolute; right:6px; top:4px; font:400 8.5px/1 ui-monospace,monospace; color:rgba(0,0,0,.62); letter-spacing:.08em; }
/* 读层标签卡（右侧） */
.reader { position:sticky; top:20px; margin:clamp(10px,2vh,24px) clamp(20px,5vw,64px) 40px; border-left:2px solid var(--strata3); padding-left:20px; min-height:150px; max-width:520px; }
.reader .k { font:500 10px/1 ui-monospace,monospace; letter-spacing:.3em; color:var(--strata3); margin-bottom:12px; }
.reader h3 { font-weight:400; font-size:24px; letter-spacing:.12em; }
.reader .meta { font:400 12px/2 ui-monospace,monospace; color:var(--dim); margin-top:10px; }
.reader p { margin-top:12px; font-size:13.5px; line-height:2; color:var(--dim); }
.reader .hint { color:var(--dim); font-size:12.5px; letter-spacing:.15em; }
footer { padding:14px clamp(20px,5vw,64px) 26px; font:400 9.5px/1.8 ui-monospace,monospace; color:var(--dim); letter-spacing:.2em; }
@media (max-width:760px) {
  .core-wall { flex-direction:column; }
  .core { max-width:none; }
  .reader { position:static; }
}
</style>
</head>
<body>
<header>
  <h1>地层档案 · 火山岩芯</h1>
  <span class="no">CORE ARCHIVE — VOLCANO STRATA · 全球火山活动档案（隐喻版）</span>
</header>
<div class="core-wall" id="wall"></div>
<div class="reader" id="reader">
  <div class="k">READ A LAYER — 读层</div>
  <h3>点击任一岩芯层位</h3>
  <div class="meta">深度即年代 · 色带即岩性 · 层位即喷发事件</div>
  <p class="hint">地质学家逐层解读地层——点亮一层，右侧揭示该年代的喷发记录。</p>
</div>
<footer>示例数据 · 公开地质资料常识口径 · 隐喻：地层剖面岩芯柱（LLM 推导，见 metaphor-briefs.json）</footer>
<script type="module">
const VOLC = [
  { n:'维苏威', sub:'Vesuvius · 意大利 · 1281m', layers:[
    { yr:'1944', h:26, c:'#b0793e', t:'二战期间喷发', d:'1944 年 3 月的喷发是维苏威近百年最后一次，熔岩流毁坏圣塞巴斯蒂亚诺镇，此后进入休眠。', type:'普林尼式边缘 · 熔岩流' },
    { yr:'1906', h:34, c:'#8a5a33', t:'大喷发', d:'1906 年 4 月剧烈喷发，喷发柱高达数千米，那不勒斯一度戒严。', type:'斯通博利式→熔岩喷泉' },
    { yr:'1631', h:44, c:'#d19a5b', t:'毁灭性喷发', d:'1631 年 12 月大喷发，火山泥流与碎屑流致约三千人遇难，此后进入周期性小喷发期。', type:'普林尼式' },
    { yr:'79', h:56, c:'#6e4626', t:'庞贝湮灭', d:'公元 79 年普林尼式大喷发埋葬庞贝与赫库兰尼姆，是火山学命名的原型事件。', type:'普林尼式（命名原型）' },
  ]},
  { n:'富士山', sub:'Mt. Fuji · 日本 · 3776m', layers:[
    { yr:'1707', h:60, c:'#8a5a33', t:'宝永喷发', d:'1707 年宝永四年大喷发，火山灰直达江户，至今休眠 300 余年；山体留下宝永火口。', type:'普林尼式 · 火山碎屑' },
    { yr:'864', h:40, c:'#b0793e', t:'贞观喷发', d:'864 年贞观六年喷发，青木原树海熔原即此次熔岩流所成。', type:'裂隙式 · 熔岩流' },
    { yr:'800', h:28, c:'#d19a5b', t:'延历喷发', d:'延历年间多次喷发，史书载"灰降相模国"。', type:'斯通博利式' },
  ]},
  { n:'乞力马扎罗', sub:'Kilimanjaro · 坦桑尼亚 · 5895m', layers:[
    { yr:'~1700', h:34, c:'#5b544a', t:'休眠层', d:'约 150-250 年前最后一次显著活动，此后长期休眠，现为层状火山穹丘。', type:'层状火山 · 休眠' },
    { yr:'~360000', h:52, c:'#6e4626', t:'主体堆积期', d:'约 36 万年前起，希拉、马文齐、基博三座火山锥相继堆积成今日山体。', type:'盾状→层状过渡' },
    { yr:'~2500000', h:64, c:'#4a4540', t:'基底起点', d:'约 250 万年前大裂谷火山活动起点，东非高原熔岩台基。', type:'裂谷火山 · 台基' },
  ]},
];
const wall = document.getElementById('wall'), reader = document.getElementById('reader');
const fmt = (y) => y.startsWith('~') ? y.slice(1) + ' 年前' : (Number(y) < 1000 ? '公元 ' + y : y + ' 年');
for (const v of VOLC) {
  const core = document.createElement('div');
  core.className = 'core';
  core.innerHTML = `<h2>${v.n}</h2><div class="sub">${v.sub}</div><div class="strata"></div>`;
  const box = core.querySelector('.strata');
  for (const l of v.layers) {
    const el = document.createElement('div');
    el.className = 'layer';
    el.style.height = l.h * 2.6 + 'px';
    el.style.background = `linear-gradient(180deg, ${l.c} 0%, ${l.c}cc 60%, ${l.c}99 100%)`;
    el.innerHTML = `<span class="yr">${fmt(l.yr)}</span>`;
    el.addEventListener('click', () => {
      document.querySelectorAll('.layer.on').forEach((x) => x.classList.remove('on'));
      el.classList.add('on');
      const t0 = performance.now();
      reader.innerHTML = `<div class="k">READ A LAYER — 读层 · ${v.n}</div>
        <h3>${l.t}</h3>
        <div class="meta">${fmt(l.yr)} ／ ${l.type} ／ 埋深示意 ${l.h * 2.6 | 0}mm</div>
        <p>${l.d}</p>`;
      console.debug('[读层] 响应', Math.round(performance.now() - t0), 'ms（验收线 1000ms）');
    });
    box.appendChild(el);
  }
  wall.appendChild(core);
}
</script>
</body>
</html>
